openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: marketplace
    description: Public product discovery and guest checkout
  - name: sellers
    description: Seller registration and catalog management
  - name: orders
    description: Order creation and fulfillment
  - name: admin
    description: Marketplace administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [marketplace]
      summary: List approved products
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /products/{id}:
    get:
      operationId: getProduct
      tags: [marketplace]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { description: Product not found }
  /seller/profile:
    get:
      operationId: getSellerProfile
      tags: [sellers]
      summary: Get the current seller application
      responses:
        "200":
          description: Seller profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seller" }
        "404": { description: Seller application not found }
    post:
      operationId: applyAsSeller
      tags: [sellers]
      summary: Submit a seller application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellerApplicationInput" }
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seller" }
        "409": { description: Application already exists }
  /seller/products:
    get:
      operationId: listSellerProducts
      tags: [sellers]
      summary: List the current seller's products
      responses:
        "200":
          description: Seller products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createSellerProduct
      tags: [sellers]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /seller/products/{id}:
    patch:
      operationId: updateSellerProduct
      tags: [sellers]
      summary: Update a seller-owned product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { description: Product not found }
    delete:
      operationId: deleteSellerProduct
      tags: [sellers]
      summary: Delete a seller-owned product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Product deleted }
        "404": { description: Product not found }
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a guest order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { description: Invalid order }
  /seller/orders:
    get:
      operationId: listSellerOrders
      tags: [sellers]
      summary: List orders containing seller products
      responses:
        "200":
          description: Seller orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /seller/orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [sellers]
      summary: Update status for an order containing the seller's products
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderStatusUpdate" }
      responses:
        "200":
          description: Updated seller order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { description: Order not found for this seller }
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get marketplace overview metrics
      responses:
        "200":
          description: Marketplace summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSummary" }
  /admin/sellers:
    get:
      operationId: listAdminSellers
      tags: [admin]
      summary: List seller applications
      responses:
        "200":
          description: Seller applications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Seller" }
  /admin/sellers/{id}/decision:
    patch:
      operationId: decideSellerApplication
      tags: [admin]
      summary: Approve or reject a seller
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellerDecision" }
      responses:
        "200":
          description: Updated seller application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seller" }
        "404": { description: Seller not found }
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List marketplace orders
      responses:
        "200":
          description: All orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, sellerId, sellerName, title, description, category, price, imageUrl, stock, active, createdAt]
      properties:
        id: { type: integer }
        sellerId: { type: integer }
        sellerName: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number }
        imageUrl: { type: ["string", "null"] }
        stock: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [title, description, category, price, stock]
      properties:
        title: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, minLength: 5, maxLength: 3000 }
        category: { type: string, minLength: 2, maxLength: 80 }
        price: { type: number, exclusiveMinimum: 0 }
        imageUrl: { type: ["string", "null"] }
        stock: { type: integer, minimum: 0 }
    ProductUpdate:
      type: object
      properties:
        title: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, minLength: 5, maxLength: 3000 }
        category: { type: string, minLength: 2, maxLength: 80 }
        price: { type: number, exclusiveMinimum: 0 }
        imageUrl: { type: ["string", "null"] }
        stock: { type: integer, minimum: 0 }
        active: { type: boolean }
    Seller:
      type: object
      required: [id, clerkUserId, storeName, contactName, phone, email, status, createdAt]
      properties:
        id: { type: integer }
        clerkUserId: { type: string }
        storeName: { type: string }
        contactName: { type: string }
        phone: { type: string }
        email: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
    SellerApplicationInput:
      type: object
      required: [storeName, contactName, phone]
      properties:
        storeName: { type: string, minLength: 2, maxLength: 120 }
        contactName: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, minLength: 6, maxLength: 40 }
    SellerDecision:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, rejected] }
    OrderLineInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1, maximum: 100 }
    OrderLine:
      type: object
      required: [productId, productTitle, sellerId, sellerName, quantity, unitPrice, lineTotal]
      properties:
        productId: { type: integer }
        productTitle: { type: string }
        sellerId: { type: integer }
        sellerName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
    OrderInput:
      type: object
      required: [buyerName, phone, city, address, items]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90, nullable: true }
        longitude: { type: number, minimum: -180, maximum: 180, nullable: true }
        buyerName: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, minLength: 6, maxLength: 40 }
        city: { type: string, minLength: 2, maxLength: 120 }
        address: { type: string, minLength: 5, maxLength: 500 }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: "#/components/schemas/OrderLineInput" }
    Order:
      type: object
      required: [id, orderCode, buyerName, phone, city, address, latitude, longitude, items, total, status, createdAt]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90, nullable: true }
        longitude: { type: number, minimum: -180, maximum: 180, nullable: true }
        id: { type: integer }
        orderCode: { type: string }
        buyerName: { type: string }
        phone: { type: string }
        city: { type: string }
        address: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        total: { type: number }
        status: { type: string, enum: [new, preparing, shipped, delivered, cancelled] }
        createdAt: { type: string, format: date-time }
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [new, preparing, shipped, delivered, cancelled] }
    AdminSummary:
      type: object
      required: [totalSellers, pendingSellers, totalProducts, totalOrders, openOrders, revenue]
      properties:
        totalSellers: { type: integer }
        pendingSellers: { type: integer }
        totalProducts: { type: integer }
        totalOrders: { type: integer }
        openOrders: { type: integer }
        revenue: { type: number }

